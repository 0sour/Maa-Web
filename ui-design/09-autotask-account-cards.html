<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动任务 · 设计稿 E（账号卡片并排）</title>
<style>
  :root{
    --bg:#1a1d22; --bg-panel:#23272e; --bg-subtle:#2c2e34; --bg-active:rgba(216,177,106,.12);
    --border:#3a3f49; --border-strong:#565d6b;
    --text:#e8e6df; --text-2:#9b9688; --text-3:#6d6a5e;
    --gold:#d8b16a; --gold-strong:#a97f2f;
    --ok:#9fb56f; --warn:#c98f4e; --err:#b05b53;
    --mono:Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:13px "Microsoft YaHei","PingFang SC",sans-serif;padding:26px}
  .page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .top{display:flex;align-items:center;gap:10px}
  .diamond{width:13px;height:13px;border:1px solid var(--gold);transform:rotate(45deg);flex-shrink:0;background:rgba(216,177,106,.15)}
  .top b{font-size:18px;letter-spacing:2px}
  .top small{margin-left:auto;color:var(--text-3);font-size:11px}

  .panel{background:var(--bg-panel);border:1px solid var(--border);padding:18px}
  .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .ph .diamond{width:10px;height:10px}
  .ph b{font-size:13.5px;letter-spacing:1px}
  .ph small{margin-left:auto;color:var(--text-3);font-size:11px}

  .row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border)}
  .row:last-child{border:none}
  .row label{flex:1;font-size:12.5px;color:var(--text-2)}
  .row label small{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
  .wds{display:flex;gap:5px}
  .wd{width:26px;height:26px;line-height:26px;text-align:center;font-size:11.5px;border:1px solid var(--border);color:var(--text-3);cursor:pointer;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
  .wd.on{border-color:var(--gold-strong);color:var(--gold);background:var(--bg-active)}
  .time{background:var(--bg-subtle);border:1px solid var(--border);color:var(--gold);font-family:var(--mono);font-size:14px;padding:7px 12px;letter-spacing:1px;outline:none;width:110px}
  .sw{width:34px;height:16px;border:1px solid var(--border-strong);position:relative;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);flex-shrink:0}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--border-strong)}
  .sw.on{background:rgba(216,177,106,.25);border-color:var(--gold-strong)}
  .sw.on::after{left:20px;background:var(--gold)}

  /* 账号卡片 */
  .acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .acard{background:var(--bg-subtle);border:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
  .acard:hover{border-color:var(--gold-strong)}
  .acard-hd{display:flex;align-items:center;gap:8px}
  .acard-hd .idx{font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid var(--gold-strong);width:20px;height:20px;line-height:18px;text-align:center;transform:rotate(45deg)}
  .acard-hd .idx span{display:inline-block;transform:rotate(-45deg)}
  .acard-hd .acc-name{flex:1;font-size:13.5px;letter-spacing:.5px}
  .acard-hd .x{cursor:pointer;color:var(--text-3)}
  .acard-hd .x:hover{color:var(--err)}
  .acard .sel{background:var(--bg-panel);border:1px solid var(--border-strong);color:var(--text);padding:7px 10px;font-size:12px;width:100%;outline:none}
  .acard .tasks{font-family:var(--mono);font-size:10.5px;color:var(--text-3);line-height:1.7;min-height:44px;border:1px dashed var(--border);padding:7px 9px;background:var(--bg-panel)}
  .acard .more{border:1px solid var(--border);background:none;color:var(--text-2);font-size:11px;padding:4px 10px;cursor:pointer;align-self:flex-start}
  .acard .more:hover{color:var(--gold);border-color:var(--gold-strong)}
  .acard.dim{opacity:.6}
  .acard .offlbl{position:absolute;top:14px;right:34px;font-size:10px;color:var(--text-3);border:1px solid var(--border);padding:1px 6px}
  .add-card{border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:13px;cursor:pointer;min-height:150px}
  .add-card:hover{color:var(--gold);border-color:var(--gold-strong)}
  .note{font-size:11px;color:var(--text-3);margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div class="page">
  <div class="top"><span class="diamond"></span><b>自动任务 · 每日长草</b><small>每个账号独立配置各自的任务方案</small></div>

  <!-- 调度信息 -->
  <div class="panel">
    <div class="ph"><span class="diamond"></span><b>调度</b><small>星期 × 时间</small></div>
    <div class="row">
      <label>启用</label><span class="sw on"></span>
    </div>
    <div class="row">
      <label>执行星期</label>
      <div class="wds"><span class="wd on">一</span><span class="wd on">二</span><span class="wd on">三</span><span class="wd on">四</span><span class="wd on">五</span><span class="wd on">六</span><span class="wd on">日</span></div>
    </div>
    <div class="row">
      <label>执行时间</label>
      <input class="time" value="06:30">
    </div>
  </div>

  <!-- 账号卡片：每账号一卡，独立选方案 -->
  <div class="panel">
    <div class="ph"><span class="diamond"></span><b>账号</b><small>每个账号执行自己的方案（顺序 = 卡片顺序）</small></div>
    <div class="acards">
      <div class="acard">
        <div class="acard-hd"><span class="idx"><span>1</span></span><b class="acc-name">账号A（官服）</b><span class="x">✕</span></div>
        <select class="sel"><option>方案：日常六件套（5 项）</option><option>方案：基建（2 项）</option></select>
        <div class="tasks">StartUp / Infrast / Mall / Fight CE-6 / Award</div>
        <button class="more">展开参数…</button>
      </div>
      <div class="acard">
        <div class="acard-hd"><span class="idx"><span>2</span></span><b class="acc-name">账号B（官服）</b><span class="x">✕</span></div>
        <select class="sel"><option>方案：基建（2 项）</option></select>
        <div class="tasks">StartUp / Infrast</div>
        <button class="more">展开参数…</button>
      </div>
      <div class="acard dim">
        <div class="acard-hd"><span class="idx"><span>3</span></span><b class="acc-name">账号C（B服）</b><span class="offlbl">停用</span><span class="x">✕</span></div>
        <select class="sel"><option>方案：活动图（3 项）</option></select>
        <div class="tasks">StartUp / Fight TO-7 / Award</div>
        <button class="more">展开参数…</button>
      </div>
      <div class="add-card">＋ 添加账号</div>
    </div>
    <p class="note">执行顺序：账号A → 账号B → 账号C（停用跳过）。每个账号的方案独立快照；「展开参数」可查看/微调该账号的方案任务（改动仅存于此账号）。</p>
  </div>
</div>
</body>
</html>
