<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动任务 · 设计稿 B（列表 + 详情双栏）</title>
<style>
  :root{
    --bg:#1a1d22; --bg-panel:#23272e; --bg-subtle:#2c2e34; --bg-active:rgba(216,177,106,.12);
    --border:#3a3f49; --border-strong:#565d6b;
    --text:#e8e6df; --text-2:#9b9688; --text-3:#6d6a5e;
    --gold:#d8b16a; --gold-strong:#a97f2f;
    --ok:#9fb56f; --warn:#c98f4e; --err:#b05b53;
    --mono:Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:13px "Microsoft YaHei","PingFang SC",sans-serif;padding:26px}
  .page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px}
  .diamond{width:13px;height:13px;border:1px solid var(--gold);transform:rotate(45deg);flex-shrink:0;background:rgba(216,177,106,.15)}
  .title b{font-size:18px;letter-spacing:2px}
  .title small{display:block;color:var(--text-3);font-size:11px;margin-top:2px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .sel{background:var(--bg-subtle);border:1px solid var(--border);color:var(--text);padding:7px 12px;font-size:12px;min-width:150px;outline:none}

  .body{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}

  /* 左：自动任务列表 */
  .list{background:var(--bg-panel);border:1px solid var(--border);display:flex;flex-direction:column}
  .list-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .list-hd b{font-size:13px;letter-spacing:1px}
  .list-hd small{color:var(--text-3);font-size:10.5px}
  .list-hd .add{margin-left:auto;border:1px dashed var(--border-strong);background:none;color:var(--text-2);padding:4px 12px;cursor:pointer;font-size:11.5px}
  .item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--border);cursor:pointer}
  .item:hover{background:var(--bg-subtle)}
  .item.sel{background:var(--bg-active);border-left:2px solid var(--gold-strong)}
  .sw{width:30px;height:14px;border:1px solid var(--border-strong);position:relative;flex-shrink:0;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
  .sw::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;background:var(--border-strong)}
  .sw.on{background:rgba(216,177,106,.25);border-color:var(--gold-strong)}
  .sw.on::after{left:17px;background:var(--gold)}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-size:13px;letter-spacing:.5px}
  .item .nm small{color:var(--text-3);font-size:10.5px;font-family:var(--mono)}
  .item .tm{font-family:var(--mono);font-size:15px;color:var(--gold)}

  /* 右：详情 + 执行 + 日志 */
  .right{display:flex;flex-direction:column;gap:16px;min-width:0}
  .panel{background:var(--bg-panel);border:1px solid var(--border);padding:16px 18px}
  .panel-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .panel-hd .diamond{width:10px;height:10px}
  .panel-hd b{font-size:13.5px;letter-spacing:1px}
  .panel-hd small{margin-left:auto;color:var(--text-3);font-size:11px}
  .row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
  .row:last-child{border:none}
  .row label{flex:1;font-size:12.5px;color:var(--text-2);letter-spacing:.5px}
  .row label small{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
  .wds{display:flex;gap:5px}
  .wd{width:26px;height:26px;line-height:26px;text-align:center;font-size:11.5px;border:1px solid var(--border);color:var(--text-3);cursor:pointer;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
  .wd.on{border-color:var(--gold-strong);color:var(--gold);background:var(--bg-active)}
  .time{background:var(--bg-subtle);border:1px solid var(--border);color:var(--gold);font-family:var(--mono);font-size:14px;padding:7px 12px;letter-spacing:1px;outline:none;width:110px}
  .f-text{background:var(--bg-subtle);border:1px solid var(--border);color:var(--text);padding:7px 12px;font-size:12.5px;outline:none;width:100%}
  .acc-list{display:flex;gap:8px;flex-wrap:wrap}
  .acc{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);padding:5px 10px;font-size:12px}
  .acc .x{cursor:pointer;color:var(--text-3)}
  .acc .x:hover{color:var(--err)}
  .btn{border:1px solid var(--border-strong);background:var(--bg-subtle);color:var(--text);padding:7px 16px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--gold-strong);color:var(--gold)}
  .btn.gold{background:rgba(216,177,106,.14);border-color:var(--gold-strong);color:var(--gold)}
  .execbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .execbar .src{margin-left:auto;display:flex;align-items:center;gap:10px}
  .linkstart{background:rgba(216,177,106,.18);border:1px solid var(--gold-strong);color:var(--gold);font-size:15px;font-weight:700;padding:10px 34px;cursor:pointer;letter-spacing:2px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  .log{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--text-2);max-height:200px;overflow-y:auto}
  .log .ok{color:var(--ok)} .log .warn{color:var(--warn)} .log .err{color:var(--err)} .log .info{color:var(--gold)}
  .log .t{color:var(--text-3);margin-right:8px}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="title"><span class="diamond"></span><div><b>自动任务</b><small>执行中心 · 列表 + 详情配置</small></div></div>
    <div class="top-right">
      <span style="font-size:11px;color:var(--text-3)">目标设备</span>
      <select class="sel"><option>Redmi_K30 (USB) · 9b65ff77（online）</option></select>
    </div>
  </div>

  <div class="body">
    <!-- 左：任务列表 -->
    <div class="list">
      <div class="list-hd"><b>自动任务</b><small>3 个</small><button class="add">＋ 新建</button></div>
      <div class="item sel">
        <span class="sw on"></span>
        <div class="nm"><b>每日长草</b><small>日常六件套 · 账号轮换 2</small></div>
        <span class="tm">06:30</span>
      </div>
      <div class="item">
        <span class="sw on"></span>
        <div class="nm"><b>周末活动</b><small>活动图 · 账号轮换 3</small></div>
        <span class="tm">19:00</span>
      </div>
      <div class="item">
        <span class="sw"></span>
        <div class="nm"><b>基建轮班</b><small>基建 · 已停用</small></div>
        <span class="tm">12:00</span>
      </div>
    </div>

    <!-- 右：详情 -->
    <div class="right">
      <div class="panel">
        <div class="panel-hd"><span class="diamond"></span><b>每日长草 · 配置</b><small>修改自动保存</small></div>
        <div class="row">
          <label>执行方案<small>选择任务编排保存的方案，保存时固化为快照</small></label>
          <select class="sel" style="min-width:220px"><option>日常六件套（5 项）</option><option>活动图（3 项）</option></select>
        </div>
        <div class="row">
          <label>执行星期<small>未勾选则当天跳过</small></label>
          <div class="wds"><span class="wd on">一</span><span class="wd on">二</span><span class="wd on">三</span><span class="wd on">四</span><span class="wd on">五</span><span class="wd on">六</span><span class="wd on">日</span></div>
        </div>
        <div class="row">
          <label>执行时间</label>
          <input class="time" value="06:30">
        </div>
        <div class="row">
          <label>账号轮换<small>按序执行各账号后停止（依赖 StartUp 账号切换）</small></label>
          <div class="acc-list">
            <span class="acc">账号A <span class="x">✕</span></span>
            <span class="acc">账号B <span class="x">✕</span></span>
            <button class="btn" style="padding:4px 12px;font-size:11.5px">＋ 添加账号</button>
          </div>
        </div>
      </div>

      <!-- 执行控制 -->
      <div class="panel">
        <div class="panel-hd"><span class="diamond"></span><b>执行控制</b><small>手动立即执行</small></div>
        <div class="execbar">
          <span style="font-size:11px;color:var(--text-3)">执行对象</span>
          <select class="sel"><option>当前队列（草稿 · 4 项）</option><option>每日长草（方案）</option></select>
          <span class="tag" style="font-size:10px;border:1px solid var(--gold-strong);color:var(--gold);padding:1px 7px">账号轮换 2 个</span>
          <div class="src"><button class="linkstart">▶ LINK START</button></div>
        </div>
      </div>

      <!-- 日志 -->
      <div class="panel">
        <div class="panel-hd"><span class="diamond"></span><b>执行日志</b><small>当天实时</small></div>
        <div class="log">
          <div><span class="t">06:30:00</span><span class="info">⏰ 定时任务「每日长草」已触发（run 42）</span></div>
          <div><span class="t">06:31:47</span><span class="ok">✔ 任务链 StartUp 完成</span></div>
          <div><span class="t">06:32:06</span><span class="info">⏭ 账号轮换：切换至「账号B」…</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
