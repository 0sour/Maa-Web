# ─────────────────────────────────────────────────────────
#  Maa-Web · nginx default.conf
#
#  Ports (all within container, non-privileged 8080):
#     :8080  ← public (docker-compose maps host:8080 → container:8080)
#
#  Upstreams (via compose service DNS on maaweb-net bridge):
#     api:8000  ← FastAPI + MaaFramework backend (named service = DNS name)
#
#  Routing:
#     /api/*     → reverse proxy to api:8000 (strip nothing)
#     /healthz   → served from nginx itself (probe + passthrough fallback)
#     /ws/*      → WebSocket upgrade → api:8000 (Upgrade headers set)
#     /          → static file from /usr/share/nginx/html (SPA fallback to index.html)
#
#  NOTE: This config runs as non-root nginx user, so temp dirs are under /tmp/.
# ─────────────────────────────────────────────────────────

# WebSocket upgrade map (http context — NOT inside server{}).
# map is only legal at http level; conf.d/*.conf is included into http {}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;       # catch-all

    # 外部端口映射 ≠ 容器端口时，重定向用相对路径（否则 /api 会 301 到容器端口 8080）
    absolute_redirect off;

    # ── Temp dirs (non-root writable) ───────────────────────
    client_body_temp_path  /tmp/nginx_body;
    proxy_temp_path        /tmp/nginx_proxy;
    fastcgi_temp_path      /tmp/nginx_body;
    uwsgi_temp_path        /tmp/nginx_body;
    scgi_temp_path         /tmp/nginx_body;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Charset / security headers ──────────────────────────
    charset utf-8;
    add_header X-Content-Type-Options  "nosniff"              always;
    add_header X-Frame-Options         "SAMEORIGIN"           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # HSTS — enable only if you serve this behind HTTPS ingress
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ══════════════════════════════════════════════════════
    #  1) /api/* → FastAPI backend (REST + WebSocket)
    #     WS 端点挂在 /api/v1 前缀下（/api/v1/tasks/ws/logs），
    #     必须同时转发 Upgrade 头，否则浏览器 WS 握手失败。
    # ══════════════════════════════════════════════════════
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        # WebSocket（/api/v1/tasks/ws/logs）握手头；普通 REST 请求不受影响
        proxy_set_header   Upgrade             $http_upgrade;
        proxy_set_header   Connection          $connection_upgrade;

        # Forward host / real-IP to backend
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_set_header   X-Forwarded-Host    $host;

        # Reasonable timeouts — MaaFW long-running tasks may take >30s to respond
        # (They will use WebSocket push or SSE for intermediate log updates, so
        #  60s on REST endpoints is a generous ceiling.)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 503 on upstream unavailable → frontend can show graceful message
        proxy_next_upstream error timeout http_502 http_503;
    }

    # ══════════════════════════════════════════════════════
    #  2) /ws/* → FastAPI backend WebSocket (log stream)
    # ══════════════════════════════════════════════════════
    # NOTE: WebSocket MUST set Upgrade + Connection headers; also need
    #       HTTP/1.1 and long timeout (clients keep open for minutes/hours).
    location /ws/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade             $http_upgrade;
        proxy_set_header   Connection          $connection_upgrade;

        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;

        # Long timeout for long-lived WebSocket sessions
        proxy_connect_timeout 10s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }

    # ══════════════════════════════════════════════════════
    #  3) /healthz → local nginx stub (first responder)
    # ══════════════════════════════════════════════════════
    # Primary: serve a static 200 from nginx (proves nginx process is alive).
    # Secondary: allow /healthz/startup, /healthz/ready, /healthz/live to be
    #            proxied through to the api IF we want upstream-level probing.
    #            (Compose uses the static stub by default; /healthz/ready on api
    #            is consumed by the api container's OWN healthcheck, not by nginx.)
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"maaweb-nginx","version":"1.27-alpine","checks":{"listening":true,"static_dir_exists":true}}';
    }

    # Passthrough for root-level health probes the backend exposes
    # (keeps browser-side diagnostics simple — single origin).
    location /healthz/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;

        # If api is not yet up, return a standard "starting" response so our
        # frontend chip doesn't show error with 502 body that can't be parsed.
        error_page 502 504 = @api_starting;
    }
    location @api_starting {
        access_log off;
        default_type application/json;
        return 200 '{"status":"starting","service":"maaweb-api-proxy","message":"API container not yet reachable (depends_on waits for healthcheck). Retry in a moment."}';
    }

    # ══════════════════════════════════════════════════════
    #  4) Everything else → Vue SPA static + fallback
    # ══════════════════════════════════════════════════════
    # Cache static assets aggressively — they are content-hashed by Vite.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|avif|wasm)(\?.*)?$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback: anything not a file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 入口不缓存（引用的静态资源带 hash 长期缓存）——保证发版后浏览器立即拿到新资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── Error pages (minimal, branded via index.html fallback) ──
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
